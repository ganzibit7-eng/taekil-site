name: Verify UI and analytics
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node verify-ui-contract.cjs
      - run: node test-admin-analytics.cjs
      - run: node --test test-free-report-handoff.cjs
      - run: node --test test-visitor-exclusion.cjs
      - run: git diff --check
